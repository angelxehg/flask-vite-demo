[project]
name = "flask-vite-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Angel Hurtado", email = "stdin@angelxehg.com" }
]
requires-python = ">=3.9"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
]

[project.scripts]
flask-vite-demo = "flask_vite_demo:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=25.11.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.16.4",
]

[tool.black]
target-version = ["py39"]

[tool.ruff]
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
