[project]
name = "flask-vite-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Angel Hurtado", email = "stdin@angelxehg.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.1.0",
]

[project.scripts]
flask-vite-demo = "flask_vite_demo:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.black]
target-version = ["py39"]
extend-exclude = "frontend"

[tool.ruff]
target-version = "py39"
extend-exclude = ["frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
