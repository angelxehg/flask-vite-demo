name: Continuous Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-24.04-arm
    # This repository is public, so its run logs are world-readable and `vars.*`
    # are printed verbatim — only `secrets.*` are redacted. The registry
    # hostname embeds the AWS account ID and is a secret; the repository path
    # does not and stays a variable, so pushes still log a readable
    # ***/angelxehg/flask-vite-demo:sha-<sha>.
    env:
      IMAGE: ${{ secrets.APP_ECR_REGISTRY }}/${{ vars.APP_ECR_REPOSITORY_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.CD_ROLE_ARN }}
          role-session-name: cd-github-actions-${{ github.event.repository.name }}
          aws-region: ${{ vars.AWS_REGION }}
          # Defaults to false. Registers the account ID as a masked value, so a
          # stray occurrence anywhere later in the log is redacted too.
          mask-aws-account-id: true
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4

      # Extracts the frontend-build stage's output (not the final image) so the
      # exact hashed files that end up in the CDN bucket are byte-identical to
      # what the shipped image's manifest references — same build-args, same
      # content hashes. The manifest itself (.vite/*) stays out of the bucket:
      # it's only needed inside the image to resolve entry names to filenames.
      - name: Build frontend assets for CDN
        run: |
          docker buildx build \
            --target assets \
            --build-arg VITE_BASE_PATH=/${{ vars.AWS_S3_PREFIX }}/ \
            --cache-from type=gha,scope=frontend-build \
            --cache-to type=gha,mode=max,scope=frontend-build \
            --output type=local,dest=./frontend-dist \
            .

      # No CloudFront invalidation: the CD role has no permission to request
      # one, by design (see infra docs/Pipelines.md). Every asset filename is
      # content-hashed, so a deploy publishes new keys instead of overwriting
      # ones that might already be cached.
      - name: Sync assets to CDN bucket
        run: |
          aws s3 sync ./frontend-dist "s3://${{ vars.AWS_S3_BUCKET }}/${{ vars.AWS_S3_PREFIX }}/" \
            --exclude ".vite/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          # target: app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            STATIC_URL=${{ vars.STATIC_URL }}
            VITE_BASE_PATH=/${{ vars.AWS_S3_PREFIX }}/
          cache-from: type=gha,scope=frontend-build
          cache-to: type=gha,mode=max,scope=frontend-build
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}

  # The deploy itself runs in the private infra repository, which is why this asks
  # for one rather than performing it: a reusable workflow would run here and print
  # every deploy step into a public log. No GitHub credential is involved — the same
  # AWS role that pushed the image invokes a Lambda that holds the token, sets a
  # `deploy/prod` status on this commit, and starts the deploy. Watch that status,
  # not this job, for the outcome.
  request-deploy:
    name: Request Deploy
    needs: build-and-push
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.CD_ROLE_ARN }}
          role-session-name: cd-github-actions-${{ github.event.repository.name }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Request deploy
        env:
          # There is one environment today. The broker takes it as a field so that
          # stays true when there are two.
          ENVIRONMENT: prod
          FUNCTION: ${{ vars.CD_DISPATCH_FUNCTION }}
          APP: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          payload=$(jq -nc \
            --arg app "$APP" \
            --arg environment "$ENVIRONMENT" \
            --arg tag "sha-$COMMIT_SHA" \
            --arg sha "$COMMIT_SHA" \
            '{app:$app, environment:$environment, image_tag:$tag, commit_sha:$sha}')

          aws lambda invoke --function-name "$FUNCTION" \
            --cli-binary-format raw-in-base64-out \
            --payload "$payload" response.json > invoke.json

          cat response.json

          # invoke exits 0 even when the function raised; FunctionError is the check
          test -z "$(jq -r '.FunctionError // empty' invoke.json)"
