name: Continuous Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-24.04-arm
    # AWS_S3_BUCKET, AWS_S3_PREFIX and STATIC_URL are scoped to this environment
    # rather than to the repository, so a job reads them only by naming the
    # environment it deploys to. Declaring it also changes the OIDC subject claim
    # from `...:ref:refs/heads/main` to `...:environment:prod` — the ref is not
    # also present — which is why the CD role's trust policy lists both forms and
    # why the environment carries a deployment branch policy pinning `main`.
    # Removing this line breaks the credential step, not just the variables.
    environment: prod
    # This repository is public, so its run logs are world-readable and `vars.*`
    # are printed verbatim — only `secrets.*` are redacted. The registry
    # hostname embeds the AWS account ID and is a secret; the repository path
    # does not and stays a variable, so pushes still log a readable
    # ***/angelxehg/flask-vite-demo:sha-<sha>.
    env:
      IMAGE: ${{ secrets.APP_ECR_REGISTRY }}/${{ vars.APP_ECR_REPOSITORY_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.CD_ROLE_ARN }}
          role-session-name: cd-github-actions-${{ github.event.repository.name }}
          aws-region: ${{ vars.AWS_REGION }}
          # Defaults to false. Registers the account ID as a masked value, so a
          # stray occurrence anywhere later in the log is redacted too.
          mask-aws-account-id: true
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4

      # Extracts the frontend-build stage's output (not the final image) so the
      # exact hashed files that end up in the CDN bucket are byte-identical to
      # what the shipped image's manifest references — same build-args, same
      # content hashes. The manifest itself (.vite/*) stays out of the bucket:
      # it's only needed inside the image to resolve entry names to filenames.
      #
      # VITE_BASE_PATH is absolute, and it has to be. Vite writes this base into
      # chunk-to-chunk imports and CSS url() references, so a relative `/static/`
      # would send a lazily-loaded chunk at this application's own hostname —
      # which serves nothing under /static. STATIC_URL already ends in the same
      # prefix the sync below writes to, so appending a slash is the whole
      # derivation.
      - name: Build frontend assets for CDN
        run: |
          docker buildx build \
            --target assets \
            --build-arg VITE_BASE_PATH=${{ vars.STATIC_URL }}/ \
            --cache-from type=gha,scope=frontend-build \
            --cache-to type=gha,mode=max,scope=frontend-build \
            --output type=local,dest=./frontend-dist \
            .

      # This bucket sits behind a CloudFront distribution on a hostname of its
      # own, static.<app>.<domain>, which answers /static/* from here and
      # /media/* from a second bucket. The assets are therefore cross-origin
      # with the pages that load them: the distribution answers CORS for exactly
      # this application's origin, and core/csp.py adds STATIC_URL to the policy
      # because it is now an absolute URL. Neither is optional — a
      # `<script type="module">` always fetches in CORS mode.
      #
      # AWS_S3_PREFIX is `static`, which is the key prefix here, the path pattern
      # on the distribution, and the last segment of STATIC_URL: one value,
      # three uses, which only holds because the distribution has no origin_path.
      #
      # No CloudFront invalidation: the CD role has no permission to request
      # one, by design (see infra docs/Pipelines.md). Every asset filename under
      # assets/ is content-hashed, so a deploy publishes new keys instead of
      # overwriting ones that might already be cached. The rendered page is not
      # in this bucket at all, so a deploy is visible as soon as the container is
      # replaced.
      #
      # Two syncs, because those two sentences are only true of assets/. Files
      # copied out of frontend/public/ keep their own names forever -- favicon.svg
      # is the same key today and after the next deploy -- so uploading them
      # `immutable` for a year would mean a wrong one could never be corrected,
      # with no invalidation available to force it. An hour is long enough to be
      # a cache and short enough to be fixable.
      - name: Sync unhashed public files to CDN bucket
        run: |
          aws s3 sync ./frontend-dist "s3://${{ vars.AWS_S3_BUCKET }}/${{ vars.AWS_S3_PREFIX }}/" \
            --exclude ".vite/*" \
            --exclude "assets/*" \
            --cache-control "public, max-age=3600"

      - name: Sync hashed assets to CDN bucket
        run: |
          aws s3 sync ./frontend-dist/assets "s3://${{ vars.AWS_S3_BUCKET }}/${{ vars.AWS_S3_PREFIX }}/assets/" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            STATIC_URL=${{ vars.STATIC_URL }}
            VITE_BASE_PATH=${{ vars.STATIC_URL }}/
          cache-from: type=gha,scope=frontend-build
          cache-to: type=gha,mode=max,scope=frontend-build
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}

  # The deploy itself runs in the private infra repository, which is why this asks
  # for one rather than performing it: a reusable workflow would run here and print
  # every deploy step into a public log. No GitHub credential is involved — the same
  # AWS role that pushed the image invokes a Lambda that holds the token, sets a
  # `deploy/prod` status on this commit, and starts the deploy. Watch that status,
  # not this job, for the outcome.
  request-deploy:
    name: Request Deploy
    needs: build-and-push
    runs-on: ubuntu-24.04-arm
    # Same reason as the job above: this one assumes the same role, so it needs
    # the same subject claim.
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.CD_ROLE_ARN }}
          role-session-name: cd-github-actions-${{ github.event.repository.name }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Request deploy
        env:
          # There is one environment today. The broker takes it as a field so that
          # stays true when there are two.
          ENVIRONMENT: prod
          FUNCTION: ${{ vars.CD_DISPATCH_FUNCTION }}
          APP: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          payload=$(jq -nc \
            --arg app "$APP" \
            --arg environment "$ENVIRONMENT" \
            --arg tag "sha-$COMMIT_SHA" \
            --arg sha "$COMMIT_SHA" \
            '{app:$app, environment:$environment, image_tag:$tag, commit_sha:$sha}')

          aws lambda invoke --function-name "$FUNCTION" \
            --cli-binary-format raw-in-base64-out \
            --payload "$payload" response.json > invoke.json

          cat response.json

          # invoke exits 0 even when the function raised; FunctionError is the check
          test -z "$(jq -r '.FunctionError // empty' invoke.json)"
